<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Rutinas</title>
<style>
:root{
  /* ===== Material 3 · esquema oscuro =====
     Primario azul (continuidad con la identidad previa), terciario verde para logros/PRs.
     Los nombres siguen los roles de M3: un rol de color siempre se usa con su "on-" par. */
  --primary:#86d1ff; --on-primary:#00344b; --primary-c:#004b6b; --on-primary-c:#c7e7ff;
  --secondary:#b5c9d7; --on-secondary:#20333e; --secondary-c:#364955; --on-secondary-c:#d1e5f4;
  --tertiary:#7bdca0; --on-tertiary:#00391f; --tertiary-c:#00522f; --on-tertiary-c:#97f9bb;
  --error:#ffb4ab; --on-error:#690005; --error-c:#93000a; --on-error-c:#ffdad6;
  --warn:#ffd8a0;
  /* superficies tonales (M3 no usa negro puro en oscuro) */
  --surface:#0e1418; --surface-bright:#343a3e;
  --sc-lowest:#090f12; --sc-low:#161c20; --sc:#1a2024; --sc-high:#252b2f; --sc-highest:#2f353a;
  --on-surface:#dfe3e7; --on-surface-var:#bfc8ce;
  --outline:#899298; --outline-var:#3f484e;
  --inverse-surface:#dfe3e7; --inverse-on-surface:#2c3134;
  /* forma */
  --r-xs:4px; --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px; --r-full:9999px;
  /* movimiento: curvas y duraciones de M3 */
  --e-emph:cubic-bezier(.2,0,0,1); --e-emph-dec:cubic-bezier(.05,.7,.1,1); --e-emph-acc:cubic-bezier(.3,0,.8,.15);
  --e-std:cubic-bezier(.2,0,0,1); --e-std-dec:cubic-bezier(0,0,0,1);
  --d-s:200ms; --d-m:350ms; --d-l:500ms;
  /* ícono de check, usado como máscara en chips y segmented buttons */
  --ico-check:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z'/%3E%3C/svg%3E");
  /* elevación */
  --el1:0 1px 3px 1px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5);
  --el2:0 2px 6px 2px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.5);
  --el3:0 4px 8px 3px rgba(0,0,0,.35), 0 1px 3px rgba(0,0,0,.5);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{background:var(--surface); color:var(--on-surface); font-family:Roboto,system-ui,-apple-system,'Segoe UI',sans-serif; font-size:16px; -webkit-font-smoothing:antialiased;}
/* sin padding-bottom acá: el espacio para la nav bar y el cronómetro lo reserva
   ajustarEspacioCrono() con un espaciador real (el padding de <body> no scrollea) */
body{max-width:760px; margin:0 auto;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; font-size:inherit;}
input,select,textarea{font-family:inherit; font-size:1rem; color:var(--on-surface); background:var(--sc-high); border:none; border-bottom:1px solid var(--outline); border-radius:var(--r-xs) var(--r-xs) 0 0; padding:10px 12px; outline:none; max-width:100%; transition:background var(--d-s) var(--e-std), border-color var(--d-s) var(--e-std), box-shadow var(--d-s) var(--e-std);}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--primary); background:var(--sc-highest); box-shadow:inset 0 -1px 0 var(--primary);}
input::placeholder{color:var(--on-surface-var); opacity:.7;}
input[type=number]{-moz-appearance:textfield;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
select{appearance:none; -webkit-appearance:none; padding-right:30px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23bfc8ce'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 6px center; background-size:20px;}
/* ---- escala tipográfica de M3 ---- */
h1{font-size:1.375rem; line-height:1.75rem; font-weight:500; letter-spacing:0;}
h2{font-size:1.25rem; line-height:1.75rem; font-weight:500; letter-spacing:0;}
h3{font-size:1rem; line-height:1.5rem; font-weight:500; letter-spacing:.009em;}
.t-body{font-size:.875rem; line-height:1.25rem; letter-spacing:.016em;}
.t-label{font-size:.75rem; line-height:1rem; font-weight:500; letter-spacing:.031em;}
/* ---- ripple (respuesta táctil de M3) ---- */
.rip{position:absolute; border-radius:50%; background:currentColor; opacity:.16; pointer-events:none;
  transform:scale(0); animation:rip var(--d-l) var(--e-std) forwards;}
@keyframes rip{to{transform:scale(1); opacity:0;}}
/* capa de estado: M3 superpone el color de contenido al 8/10% en hover/pressed */
.sl{position:relative; overflow:hidden; isolation:isolate;}
.sl::after{content:''; position:absolute; inset:0; background:currentColor; opacity:0; pointer-events:none;
  transition:opacity var(--d-s) var(--e-std);}
.sl:active::after{opacity:.1;}
/* ---- top app bar ---- */
.hdr{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 4px 8px 16px; min-height:64px;}
.hdr h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
/* ---- navigation bar (M3) ---- */
.tabs{position:fixed; bottom:0; left:0; right:0; display:flex; height:80px; padding-top:12px; z-index:50;
  background:var(--sc); max-width:760px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs button{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--on-surface-var);}
.tabs .ind{width:64px; height:32px; border-radius:var(--r-full); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; transition:background var(--d-m) var(--e-emph), color var(--d-m) var(--e-emph);}
.tabs button.on{color:var(--on-surface);}
.tabs button.on .ind{background:var(--secondary-c); color:var(--on-secondary-c); animation:indIn var(--d-m) var(--e-emph-dec);}
@keyframes indIn{from{transform:scaleX(.35); opacity:.4;} to{transform:scaleX(1); opacity:1;}}
.tabs svg{width:24px; height:24px;}
.tabs .lb{font-size:.75rem; line-height:1rem; font-weight:500; letter-spacing:.031em;}
.tabs button.on .lb{font-weight:700;}
.wrap{padding:0 16px 20px;}
/* ---- cards ---- */
.card{background:var(--sc-low); border-radius:var(--r-m); padding:16px; margin-bottom:12px; box-shadow:var(--el1);}
.rcard{display:flex; align-items:center; gap:16px; cursor:pointer; transition:transform var(--d-s) var(--e-emph);}
.rcard:active{transform:scale(.985);}
.rcard .dot{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex-shrink:0;}
.rcard .meta{flex:1; min-width:0;}
.rcard .meta small{color:var(--on-surface-var); display:block; margin:2px 0; font-size:.75rem; line-height:1rem; letter-spacing:.031em;}
/* texto de apoyo de un list item: una sola línea con puntos suspensivos */
.rcard .meta small.sub{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:0;}
/* ---- icon button (M3) ---- */
.icobtn{width:48px; height:48px; border-radius:50%; border:none; color:var(--on-surface-var); background:none;
  display:flex; align-items:center; justify-content:center; font-size:1.05rem; flex-shrink:0;}
/* ---- botones (M3: filled / outlined / text) ---- */
.btn{background:var(--primary); color:var(--on-primary); border-radius:var(--r-full); min-height:40px; padding:10px 24px;
  font-size:.875rem; font-weight:500; letter-spacing:.006em; display:inline-flex; align-items:center; gap:8px;
  justify-content:center; transition:box-shadow var(--d-s) var(--e-std), transform var(--d-s) var(--e-emph);}
.btn:active{transform:scale(.97);}
.btn.full{width:100%;}
.btn.ghost{background:transparent; border:1px solid var(--outline); color:var(--primary);}
.btn.danger{background:transparent; border:1px solid var(--outline); color:var(--error);}
.btn.tonal{background:var(--secondary-c); color:var(--on-secondary-c);}
.btn.sm{min-height:32px; padding:6px 16px; font-size:.8125rem;}
/* FAB extendido: la acción principal de la pantalla */
.fab{--fy:0px; position:fixed; right:16px; bottom:96px; z-index:55; display:inline-flex; align-items:center; gap:12px;
  min-height:56px; padding:0 20px; border-radius:var(--r-l); background:var(--primary-c); color:var(--on-primary-c);
  box-shadow:var(--el3); font-size:.875rem; font-weight:600; letter-spacing:.006em;
  animation:fabIn var(--d-l) var(--e-emph-dec) backwards;
  transform:translateY(var(--fy)); transition:transform var(--d-m) var(--e-emph);}
.fab:active{transform:translateY(var(--fy)) scale(.94);}
/* cuando aparece un snackbar el FAB sube, como en Android */
body.snack .fab{--fy:-68px;}
.fab svg{width:24px; height:24px;}
@keyframes fabIn{from{transform:scale(.5) translateY(20px); opacity:0;} to{transform:scale(1) translateY(0); opacity:1;}}
@media (hover:hover){
  .btn:hover{box-shadow:var(--el1);} .fab:hover{box-shadow:var(--el3);}
  .sl:hover::after{opacity:.08;}
}
.btn.full{width:100%;}
.btn.ghost{background:transparent; border:1px solid var(--outline); color:var(--on-surface); box-shadow:none;}
.btn.danger{background:transparent; border:1px solid rgba(244,33,46,.55); color:var(--error); box-shadow:none;}
.btn.sm{padding:7px 14px; font-size:.85rem;}
/* subencabezado de sección: en M3 va en caja baja, no en mayúsculas */
.lbl{display:block; font-size:.875rem; line-height:1.25rem; color:var(--primary); margin:20px 0 10px; font-weight:500; letter-spacing:.006em;}
.lbl:first-child{margin-top:0;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
/* ---- filter chips (M3): al seleccionarse aparece el check, como en Android ---- */
.chip{display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 16px; border-radius:var(--r-s);
  background:transparent; border:1px solid var(--outline); color:var(--on-surface-var); font-size:.875rem; font-weight:500;
  letter-spacing:.006em; transition:background var(--d-s) var(--e-std), border-color var(--d-s) var(--e-std), color var(--d-s) var(--e-std);}
.chip.on{background:var(--secondary-c); border-color:transparent; color:var(--on-secondary-c); padding-left:8px;}
.chip.exc{background:var(--error-c); border-color:transparent; color:var(--on-error-c); padding-left:8px;}
.chip.on::before,.chip.exc::before{content:''; width:18px; height:18px; flex-shrink:0; background:currentColor;
  -webkit-mask:var(--ico-check) center/contain no-repeat; mask:var(--ico-check) center/contain no-repeat;
  animation:chkIn var(--d-m) var(--e-emph-dec);}
@keyframes chkIn{from{transform:scale(0) rotate(-45deg); opacity:0;} to{transform:scale(1) rotate(0); opacity:1;}}
/* ---- segmented buttons (M3) ---- */
.xtabs{display:flex; border:1px solid var(--outline); border-radius:var(--r-full); overflow:hidden;}
.xtabs button{flex:1; height:40px; color:var(--on-surface); font-weight:500; font-size:.875rem; letter-spacing:.006em;
  transition:background var(--d-s) var(--e-std);}
.xtabs button+button{border-left:1px solid var(--outline);}
.xtabs button span{display:inline-flex; align-items:center; gap:6px;}
.xtabs button.on{background:var(--secondary-c); color:var(--on-secondary-c);}
.xtabs button.on span::before{content:''; width:18px; height:18px; background:currentColor;
  -webkit-mask:var(--ico-check) center/contain no-repeat; mask:var(--ico-check) center/contain no-repeat;
  animation:chkIn var(--d-m) var(--e-emph-dec);}
.row{display:flex; gap:12px; align-items:center;}
.hint{font-size:.75rem; line-height:1rem; letter-spacing:.025em; color:var(--on-surface-var); margin-top:8px; line-height:1.5;}
/* ---- tabla de rutina ---- */
.dia{margin-bottom:14px;}
.dia-h{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 16px 12px;}
.dia-h b{font-weight:500; font-size:1rem; line-height:1.5rem;}
.dia-h small{color:var(--on-surface-var); font-weight:400; font-size:.75rem;}
.dbar{display:block; width:32px; height:4px; border-radius:var(--r-full); margin-top:8px;}
/* columnas en px (no rem): así el nombre del ejercicio no pierde ancho en pantallas chicas */
.thead,.trow{display:grid; grid-template-columns:minmax(0,1fr) 32px 44px 50px 44px 24px; gap:5px; align-items:center; padding:6px 8px;}
.thead{font-size:.6875rem; color:var(--on-surface-var); text-transform:uppercase; letter-spacing:.045em;
  border-bottom:1px solid var(--outline-var); padding-bottom:8px; font-weight:500;}
.thead div{text-align:center;} .thead div:first-child{text-align:left;}
.trow{border-bottom:1px solid var(--outline-var); position:relative;}
.trow:last-child{border-bottom:none;}
.trow .nom{font-size:.875rem; line-height:1.25rem; padding:6px 0; word-wrap:break-word; font-weight:500;}
.trow .nom small{display:block; color:var(--on-surface-var); font-size:.6875rem; margin-top:2px; font-weight:400;}
.trow input{width:100%; min-width:0; text-align:center; padding:8px 2px; font-size:.8125rem;}
.trow input.logv{background:var(--primary-c); color:var(--on-primary-c); border-bottom-color:transparent;}
.trow input.logv::placeholder{color:var(--on-primary-c); opacity:.55;}
.menu-btn{color:var(--on-surface-var); font-size:1rem; text-align:center; padding:6px 0; letter-spacing:1px; border-radius:50%;}
/* menú M3: contenedor elevado, esquinas chicas, entrada con escala */
.menu{position:absolute; right:8px; top:calc(100% - 8px); background:var(--sc-high); border-radius:var(--r-xs);
  z-index:30; box-shadow:var(--el2); overflow:hidden; min-width:180px; padding:8px 0;
  transform-origin:top right; animation:menuIn var(--d-s) var(--e-emph-dec);}
.menu.up{top:auto; bottom:calc(100% - 8px); transform-origin:bottom right;}
@keyframes menuIn{from{transform:scale(.8); opacity:0;} to{transform:scale(1); opacity:1;}}
.menu button{display:block; width:100%; text-align:left; padding:0 12px; height:48px; line-height:48px;
  font-size:.875rem; font-weight:400; letter-spacing:.016em; color:var(--on-surface);}
.addex{width:100%; padding:14px; color:var(--primary); font-size:.875rem; font-weight:500; letter-spacing:.006em;
  border-top:1px solid var(--outline-var); display:flex; align-items:center; justify-content:center; gap:8px;}
/* ---- bottom sheet / diálogos (M3) ---- */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:150; display:flex; align-items:flex-end;
  justify-content:center; animation:fade var(--d-s) var(--e-std);}
@keyframes fade{from{opacity:0} to{opacity:1}}
.modal{background:var(--sc-low); border-radius:var(--r-xl) var(--r-xl) 0 0; width:100%; max-width:760px; max-height:82vh;
  display:flex; flex-direction:column; padding:16px; box-shadow:var(--el3);
  animation:sheetUp var(--d-m) var(--e-emph-dec);}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
/* manija de arrastre: la marca visual de un bottom sheet de Android */
.modal::before{content:''; width:32px; height:4px; border-radius:var(--r-full); background:var(--on-surface-var);
  opacity:.4; margin:-4px auto 12px; flex-shrink:0;}
/* un diálogo centrado no lleva manija: esa es la marca de un bottom sheet */
.overlay[style*="center"] .modal{animation:dlgIn var(--d-m) var(--e-emph-dec);}
.overlay[style*="center"] .modal::before{display:none;}
@keyframes dlgIn{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
.modal .list{overflow-y:auto; flex:1; margin-top:10px;}
.spill{border-radius:var(--r-full); padding:12px 20px; width:100%; background:var(--sc-high); border:none;}
.spill:focus{box-shadow:0 0 0 2px var(--primary);}
.mgrp{font-size:.6875rem; color:var(--primary); font-weight:600; text-transform:uppercase; margin:16px 0 4px; letter-spacing:.045em;}
.mitem{display:block; width:100%; text-align:left; padding:12px; border-radius:var(--r-s); font-size:.875rem;
  font-weight:400; letter-spacing:.016em; color:var(--on-surface);}
.mitem small{color:var(--on-surface-var); margin-left:6px;}
/* ---- selector de color / emoji ---- */
.cdots{display:flex; gap:10px; flex-wrap:wrap;}
.cdot{width:36px; height:36px; border-radius:50%; border:2px solid transparent; transition:transform var(--d-s) var(--e-emph);}
.cdot.on{border-color:var(--on-surface); transform:scale(1.1);}
.edots{display:flex; gap:8px; flex-wrap:wrap;}
.edot{width:40px; height:40px; border-radius:50%; background:var(--sc-high); border:none; font-size:1.15rem;
  display:flex; align-items:center; justify-content:center; transition:background var(--d-s) var(--e-std), transform var(--d-s) var(--e-emph);}
.edot.on{background:var(--secondary-c); transform:scale(1.1);}
/* ---- gráfico ---- */
.chart-wrap{overflow-x:auto;}
svg text{font-family:inherit;}
/* ---- pantalla de ejercicios ---- */
.exrow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:8px 4px;
  border-bottom:1px solid var(--outline-var); font-size:.875rem; letter-spacing:.016em;}
.exrow:last-child{border-bottom:none;}
.exrow small{color:var(--on-surface-var);}
details{margin-bottom:8px;}
summary{cursor:pointer; padding:16px; background:var(--sc-low); border-radius:var(--r-m); font-weight:500;
  list-style:none; display:flex; justify-content:space-between; align-items:center; box-shadow:var(--el1);}
summary::-webkit-details-marker{display:none;}
summary .n{color:var(--on-surface-var); font-size:.75rem; font-weight:400;}
details[open] summary{border-radius:var(--r-m) var(--r-m) 0 0; box-shadow:none;}
details .body{background:var(--sc-low); border-radius:0 0 var(--r-m) var(--r-m); padding:4px 16px 8px;}
.back{color:var(--on-surface-var); font-size:1.1rem; width:48px; height:48px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.empty{text-align:center; color:var(--on-surface-var); padding:48px 24px; line-height:1.6; font-size:.875rem;}
.empty .big{font-size:2.6rem; margin-bottom:12px; animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
/* ---- snackbar (M3) ---- */
.toast{position:fixed; bottom:100px; left:16px; right:16px; margin:0 auto; max-width:520px; background:var(--inverse-surface);
  color:var(--inverse-on-surface); padding:14px 16px; border-radius:var(--r-xs); z-index:200; font-size:.875rem;
  font-weight:500; letter-spacing:.016em; box-shadow:var(--el3); overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; animation:snackIn var(--d-m) var(--e-emph-dec);}
@keyframes snackIn{from{opacity:0; transform:translateY(24px) scale(.9);} to{opacity:1; transform:translateY(0) scale(1);}}
/* ---- modo entrenamiento ---- */
.srow{display:grid; grid-template-columns:3.4rem 1fr 1fr 2.6rem; gap:10px; align-items:center; padding:6px 0;}
.srow input{width:100%; min-width:0; text-align:center; padding:10px 4px;}
.srow.done input{background:var(--tertiary-c); color:var(--on-tertiary-c); border-bottom-color:transparent;}
.chk{width:40px; height:40px; border-radius:50%; background:var(--sc-high); color:var(--on-surface-var);
  display:flex; align-items:center; justify-content:center;
  transition:background var(--d-s) var(--e-std), color var(--d-s) var(--e-std), transform var(--d-s) var(--e-emph);}
.chk.ok{background:var(--tertiary); color:var(--on-tertiary); animation:pop var(--d-m) var(--e-emph-dec);}
@keyframes pop{0%{transform:scale(1)} 45%{transform:scale(1.25)} 100%{transform:scale(1)}}
.tbar{position:fixed; bottom:0; left:0; right:0; max-width:760px; margin:0 auto; background:var(--sc);
  display:flex; justify-content:space-between; align-items:center; padding:12px 16px; z-index:60; font-weight:500;}
/* ---- calendario de actividad ---- */
.cal{display:flex; gap:3px;}
.cal .col{display:flex; flex-direction:column; gap:3px; flex:1;}
.cal i{aspect-ratio:1; border-radius:var(--r-xs); background:var(--sc-high); display:block;
  transition:background var(--d-m) var(--e-std);}
.cal i.on{background:var(--primary);}

/* ============ v2: componentes nuevos ============ */
.hdr h1{line-height:1.15;}
.secc{font-size:.875rem; line-height:1.25rem; color:var(--on-surface-var); font-weight:500; letter-spacing:.006em; margin:20px 4px 10px;}
/* fila de estadisticas (rutina) */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
.stat{background:var(--sc-low); border-radius:var(--r-m); padding:14px 4px 12px; text-align:center; box-shadow:var(--el1);}
.stat b{display:block; font-size:1.5rem; font-weight:400; line-height:2rem; color:var(--primary);}
.stat span{display:block; font-size:.6875rem; color:var(--on-surface-var); letter-spacing:.045em; margin-top:2px; font-weight:500;}
.stat .ic{font-size:.95rem; opacity:.85;}
/* ---- CRONÓMETRO: bottom sheet con indicador circular determinado (M3) ---- */
.tpanel{position:fixed; left:0; right:0; bottom:0; max-width:760px; margin:0 auto; z-index:120;
  background:var(--sc-high); border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--el3);
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px)); animation:sheetUp var(--d-m) var(--e-emph-dec);}
.tpanel.contabs{bottom:80px; padding-bottom:16px;}
.tpanel::before{content:''; display:block; width:32px; height:4px; border-radius:var(--r-full);
  background:var(--on-surface-var); opacity:.4; margin:12px auto 4px;}
.thead2{display:flex; justify-content:space-between; align-items:center; font-size:.6875rem; font-weight:600;
  letter-spacing:.045em; text-transform:uppercase; color:var(--primary);}
.tring{position:relative; width:180px; height:180px; margin:10px auto 6px;}
.tring svg{width:100%; height:100%; transform:rotate(-90deg);}
.tring .bg{fill:none; stroke:var(--sc-highest); stroke-width:12;}
.tring .fg{fill:none; stroke:var(--primary); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .25s linear, stroke var(--d-m) var(--e-std);}
.tring .tnum{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.tnum{font-size:3rem; font-weight:400; line-height:1; text-align:center; font-variant-numeric:tabular-nums;}
.tsub{text-align:center; font-size:.875rem; color:var(--on-surface-var); margin-bottom:16px; letter-spacing:.016em;}
.trow2{display:flex; gap:8px;}
.tbtn{flex:1; min-height:48px; padding:12px 2px; border-radius:var(--r-full); background:var(--sc-highest);
  color:var(--on-surface); font-weight:500; font-size:.8125rem; letter-spacing:.006em;
  transition:transform var(--d-s) var(--e-emph);}
.tbtn:active{transform:scale(.94);}
.tbtn.pri{background:var(--primary); color:var(--on-primary);}
.tpanel.fin .fg,.tpanel.fin .tnum{stroke:var(--tertiary); color:var(--tertiary);}
.tpanel.warn .tnum{color:var(--warn);}
.tpanel.warn .fg{stroke:var(--warn);}
/* aviso visual fuerte cuando no hay permiso de notificaciones */
.flash{position:fixed; inset:0; z-index:400; pointer-events:none; background:var(--tertiary); animation:fl .42s ease-in-out 3;}
@keyframes fl{0%,100%{opacity:0} 45%{opacity:.5}}
/* ---- PROGRESO FÍSICO ---- */
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.mgrid input{width:100%; text-align:center; font-size:1.75rem; font-weight:400; padding:14px 6px;}
.mgrid .u{display:block; text-align:center; font-size:.6875rem; color:var(--on-surface-var); letter-spacing:.045em; font-weight:500; margin-bottom:6px;}
.imc{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.imc b{font-size:2.25rem; font-weight:400; line-height:2.75rem; color:var(--primary);}
.bar{height:10px; border-radius:var(--r-full); margin-top:14px; position:relative; overflow:visible;
  background:linear-gradient(90deg,#7fb8ff 0 14%,var(--tertiary) 14% 40%,var(--warn) 40% 60%,var(--error) 60%);}
.bar i{position:absolute; top:-5px; width:4px; height:20px; border-radius:var(--r-full); background:var(--on-surface);
  box-shadow:0 0 0 3px var(--sc-low); transform:translateX(-2px); transition:left var(--d-l) var(--e-emph);}
.barl{display:flex; justify-content:space-between; font-size:.6875rem; color:var(--on-surface-var); margin-top:8px; font-weight:500;}
.mrow{display:grid; grid-template-columns:3.2rem 1fr 1fr 1fr 2.5rem; gap:8px; align-items:center; min-height:48px;
  padding:8px 2px; border-bottom:1px solid var(--outline-var); font-size:.875rem; letter-spacing:.016em;}
.mrow:last-child{border-bottom:none;}
.mrow .d{color:var(--on-surface-var); font-size:.75rem; font-weight:500;}
.mrow b{font-weight:500; font-variant-numeric:tabular-nums;}
.mrow .c{text-align:center;}
.sube{color:var(--warn); font-size:.75rem; font-weight:500;}
.baja{color:var(--tertiary); font-size:.75rem; font-weight:500;}
.mhead{display:grid; grid-template-columns:3.2rem 1fr 1fr 1fr 2.5rem; gap:8px; padding:0 2px 8px;
  border-bottom:1px solid var(--outline-var); font-size:.6875rem; color:var(--on-surface-var);
  text-transform:uppercase; letter-spacing:.045em; font-weight:500;}
.mhead div{text-align:center;} .mhead div:first-child{text-align:left;}
/* ---- pegar rutina ---- */
.opt{display:block; width:100%; text-align:left; padding:16px; border-radius:var(--r-m); background:var(--sc-high);
  margin-bottom:8px; font-weight:500; font-size:.875rem; transition:transform var(--d-s) var(--e-emph);}
.opt:active{transform:scale(.98);}
.opt small{display:block; color:var(--on-surface-var); font-weight:400; margin-top:4px; font-size:.75rem; line-height:1rem;}

/* ============ MOVIMIENTO ============ */
/* entrada escalonada de listas: cada elemento entra un toque después del anterior */
.stagger>*{animation:enter var(--d-m) var(--e-emph-dec) backwards;}
.stagger>*:nth-child(1){animation-delay:0ms}   .stagger>*:nth-child(2){animation-delay:30ms}
.stagger>*:nth-child(3){animation-delay:60ms}  .stagger>*:nth-child(4){animation-delay:90ms}
.stagger>*:nth-child(5){animation-delay:120ms} .stagger>*:nth-child(6){animation-delay:150ms}
.stagger>*:nth-child(n+7){animation-delay:180ms}
@keyframes enter{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
/* celebración de PR */
.pr-pop{animation:prPop var(--d-l) var(--e-emph-dec);}
@keyframes prPop{0%{transform:scale(1)} 35%{transform:scale(1.12)} 100%{transform:scale(1)}}
/* transición entre pantallas (View Transitions API, Chrome Android) */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important;}
}
::view-transition-old(root){animation:vtOut var(--d-s) var(--e-emph-acc) both;}
::view-transition-new(root){animation:vtIn var(--d-m) var(--e-emph-dec) both;}
@keyframes vtOut{to{opacity:0; transform:scale(.96);}}
@keyframes vtIn{from{opacity:0; transform:scale(1.03);} to{opacity:1; transform:scale(1);}}
</style>

/* ============ DATOS BASE ============ */

/* [nombre, músculo, tier(1=compuesto 2=secundario 3=aislamiento), reps por defecto] */

 ['Curl femoral sentado','Femoral',3,'10-15'],
 ['Hip thrust con barra','Glúteos',1,'8-12'],
 ['Puente de glúteos','Glúteos',2,'10-15'],
 ['Patada de glúteo en polea','Glúteos',3,'12-15'],
 ['Abducción de cadera en máquina','Glúteos',3,'12-20'],
 ['Elevación de gemelos de pie','Gemelos',3,'10-15'],
 ['Elevación de gemelos sentado','Gemelos',3,'12-20'],
 ['Gemelos en prensa','Gemelos',3,'10-15'],
 ['Crunch en polea alta','Abdominales',3,'12-15'],
 ['Elevación de piernas colgado','Abdominales',3,'10-15'],
 ['Crunch en banco declinado','Abdominales',3,'12-20'],
 ['Rueda abdominal','Abdominales',3,'8-12'],
 ['Plancha','Abdominales',3,'30-60s'],
 ['Giro ruso (russian twist)','Abdominales',3,'15-20'],
 ['Encogimientos con barra','Trapecios',3,'10-15'],
 ['Encogimientos con mancuernas','Trapecios',3,'12-15'],
 ['Curl de muñeca con barra','Antebrazos',3,'15-20'],
 ['Curl inverso con barra','Antebrazos',3,'10-15'],
 ['Paseo del granjero','Antebrazos',3,'30-40s'],
];

/* ============ ESTADO ============ */
const KEY='rutinasGym_v1';
let S=null;
function cargar(){
  try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
  if(!S||!S.ejercicios){ S={ejercicios:DB.map((e,i)=>({id:'e'+i,nombre:e[0],musculo:e[1],tier:e[2],reps:e[3],custom:false})),rutinas:[]}; guardar(); }
  normalizar();
}
function normalizar(){
  if(!S.rutinas) S.rutinas=[];
  S.rutinas.forEach(r=>{ if(!r.sesiones) r.sesiones=[]; if(!r.dias) r.dias=[]; });
  if(!S.descanso) S.descanso=90;
  if(!Array.isArray(S.medidas)) S.medidas=[];
  if(!S.desde) S.desde=hoy();
  if(S.ultimoRespaldo===undefined) S.ultimoRespaldo=null;
  if(!S.logs) S.logs={};
  // migración: el historial de peso/reps vivía por instancia de ejercicio (por día),
  // por eso el mismo ejercicio en dos días no se veía conectado. Se junta todo en
  // S.logs (por ejercicio, global) y se borra de la instancia vieja — idempotente,
  // en la siguiente carga ya no queda e.log para migrar.
  S.rutinas.forEach(r=>r.dias.forEach(d=>d.ejercicios.forEach(e=>{
    if(e.log&&e.log.length){ mezclarLog(e.exId,e.log); delete e.log; }
  })));
}
function mezclarLog(exId,entries){
  if(!entries||!entries.length) return;
  const mapa={};
  (S.logs[exId]||[]).forEach(x=>{ mapa[x.f]=x; });
  entries.forEach(x=>{ if(x&&x.f) mapa[x.f]={f:x.f,p:x.p!=null?x.p:null,r:x.r!=null?x.r:null}; });
  S.logs[exId]=Object.values(mapa).sort((a,b)=>a.f<b.f?-1:(a.f>b.f?1:0));
}
function guardar(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hoy(){ return isoDe(new Date()); }
function fFecha(iso){ const p=iso.split('-'); return p[2]+'/'+p[1]; }
function repsTope(reps){ const s=String(reps); if(/s$/i.test(s)) return null; const m=s.match(/(\d+)(?!.*\d)/); return m?+m[1]:null; }
function prDe(exId){ const l=S.logs[exId]; if(!l) return null; let best=null; l.forEach(x=>{ if(x.p!=null&&(best==null||x.p>best)) best=x.p; }); return best; }
function fechasEntrenadas(r){ const set=new Set(); (r.sesiones||[]).forEach(s=>set.add(s.f)); r.dias.forEach(d=>d.ejercicios.forEach(e=>(S.logs[e.exId]||[]).forEach(l=>set.add(l.f)))); return set; }
function claveSemana(iso){ const d=new Date(iso+'T12:00:00'); const dia=(d.getDay()+6)%7; d.setDate(d.getDate()-dia); return isoDe(d); }
function rachaSemanas(fechas){
  const sem=new Set(); fechas.forEach(f=>sem.add(claveSemana(f)));
  let lun=claveSemana(hoy());
  if(!sem.has(lun)){ const d=new Date(lun+'T12:00:00'); d.setDate(d.getDate()-7); lun=isoDe(d); }
  let n=0;
  while(sem.has(lun)){ n++; const d=new Date(lun+'T12:00:00'); d.setDate(d.getDate()-7); lun=isoDe(d); }
  return n;
}
function exPorId(id){ return S.ejercicios.find(e=>e.id===id); }
function rutina(id){ return S.rutinas.find(r=>r.id===id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function ultLog(exId){ const l=S.logs[exId]; return l&&l.length?l[l.length-1]:null; }

let vista={p:'inicio'};
let formCrear=null;  // estado del formulario de creación (ojo: no llamarlo "form" — choca con la propiedad .form de los elementos en handlers inline)
let picker=null;     // estado del modal buscador
let menuAbierto=null;

/* ============ GENERADOR ============ */
const FACTOR={Pecho:1,Espalda:1,Hombros:.9,'Bíceps':.75,'Tríceps':.75,'Cuádriceps':1,Femoral:.8,'Glúteos':.55,Gemelos:.5,Abdominales:.5,Trapecios:.4,Antebrazos:0};
const CAPS={45:17,60:22,75:26,90:31};

function elegirSplit(nd,f,prios){
  const U=['Pecho','Espalda','Hombros','Bíceps','Tríceps'];
  const L=['Cuádriceps','Femoral','Glúteos','Gemelos','Abdominales'];
  const PUSH=['Pecho','Hombros','Tríceps'];
  const PULL=['Espalda','Trapecios','Bíceps','Antebrazos'];
  const FULL=['Cuádriceps','Pecho','Espalda','Hombros','Femoral','Bíceps','Tríceps'];
  const d=(t,m)=>({titulo:t,musculos:m});
  const extra=()=>d('Puntos débiles y abs',[...new Set([...(prios||[]),'Abdominales'])]);
  if(f===1){
    if(nd<=2) return {n:'Upper / Lower',dias:[d('Upper',U),d('Lower',L)].slice(0,nd)};
    if(nd===3) return {n:'Push Pull Legs',dias:[d('Push',PUSH),d('Pull',PULL),d('Piernas',L)]};
    if(nd===4) return {n:'Bro Split 4 días',dias:[d('Pecho y tríceps',['Pecho','Tríceps']),d('Espalda y bíceps',['Espalda','Bíceps']),d('Hombros y abs',['Hombros','Trapecios','Abdominales']),d('Piernas',['Cuádriceps','Femoral','Glúteos','Gemelos'])]};
    const b5=[d('Pecho',['Pecho']),d('Espalda',['Espalda']),d('Piernas',['Cuádriceps','Femoral','Glúteos','Gemelos']),d('Hombros y abs',['Hombros','Trapecios','Abdominales']),d('Brazos',['Bíceps','Tríceps','Antebrazos'])];
    if(nd===5) return {n:'Bro Split',dias:b5};
    const b6=[d('Pecho',['Pecho']),d('Espalda',['Espalda']),d('Cuádriceps y gemelos',['Cuádriceps','Gemelos']),d('Hombros y abs',['Hombros','Trapecios','Abdominales']),d('Brazos',['Bíceps','Tríceps','Antebrazos']),d('Femoral y glúteos',['Femoral','Glúteos','Abdominales'])];
    if(nd===6) return {n:'Bro Split 6 días',dias:b6};
    return {n:'Bro Split 6 días + extra',dias:[...b6,extra()]};
  }
  if(f===2){
    if(nd<=2) return {n:'Full Body',dias:[d('Full Body A',FULL),d('Full Body B',[...FULL.slice().reverse(),'Abdominales'])].slice(0,nd)};
    if(nd===3) return {n:'Upper / Lower / Full',dias:[d('Upper',U),d('Lower',L),d('Full Body',FULL)]};
    if(nd===4) return {n:'Upper / Lower',dias:[d('Upper A',U),d('Lower A',L),d('Upper B',U),d('Lower B',L)]};
    if(nd===5) return {n:'PPL + Upper / Lower',dias:[d('Push',PUSH),d('Pull',PULL),d('Piernas',L),d('Upper',U),d('Lower',L)]};
    const p6=[d('Push A',PUSH),d('Pull A',PULL),d('Piernas A',L),d('Push B',PUSH),d('Pull B',PULL),d('Piernas B',L)];
    if(nd===6) return {n:'Push Pull Legs x2',dias:p6};
    return {n:'PPL x2 + extra',dias:[...p6,extra()]};
  }
  // f===3
  if(nd<=4) return {n:'Full Body',dias:Array.from({length:nd},(_,i)=>d('Full Body '+String.fromCharCode(65+i),i%2?[...FULL.slice().reverse(),'Abdominales']:FULL))};
  if(nd===5) return {n:'Upper / Lower x5',dias:[d('Upper A',U),d('Lower A',L),d('Upper B',U),d('Lower B',L),d('Upper C',U)]};
  const u6=[d('Upper A',U),d('Lower A',L),d('Upper B',U),d('Lower B',L),d('Upper C',U),d('Lower C',L)];
  if(nd===6) return {n:'Upper / Lower x3',dias:u6};
  return {n:'Upper / Lower x3 + extra',dias:[...u6,extra()]};
}

function repartir(total,n){
  const base=Math.floor(total/n), rem=total-base*n;
  return Array.from({length:n},(_,i)=>base+(i<rem?1:0));
}
function partirSeries(q){
  if(q<=0) return [];
  if(q<=4) return [Math.max(2,q)];
  let n=Math.max(1,Math.round(q/3.5));
  if(q/n>4.5) n=Math.ceil(q/4);
  return repartir(q,n);
}

function generarRutina(p){
  // p: {nombre, diasSem:[...], frecuencia, volMin, volMax, tiempo, prios:[], incluir:[ids], excluir:[ids]}
  const split=elegirSplit(p.diasSem.length,p.frecuencia,p.prios);
  const mid=Math.round((p.volMin+p.volMax)/2);
  const objetivo={};
  MUSCULOS.forEach(m=>{
    const prio=p.prios.includes(m);
    const base=prio?p.volMax:mid;
    let f=FACTOR[m];
    if(prio&&f<0.6) f=0.6;
    objetivo[m]=Math.round(base*f);
  });
  // pools por músculo: incluidos primero, luego por tier
  const pools={},cursor={};
  MUSCULOS.forEach(m=>{
    const inc=p.incluir.map(exPorId).filter(e=>e&&e.musculo===m&&!p.excluir.includes(e.id));
    const resto=S.ejercicios.filter(e=>e.musculo===m&&!p.excluir.includes(e.id)&&!inc.some(i=>i.id===e.id))
      .sort((a,b)=>a.tier-b.tier);
    pools[m]=[...inc,...resto]; cursor[m]=0;
  });
  const pick=m=>{
    const pool=pools[m]; if(!pool.length) return null;
    const e=pool[cursor[m]%pool.length]; cursor[m]++; return e;
  };
  // cuota de series por día y músculo
  const cap=CAPS[p.tiempo]||22;
  const cuota=split.dias.map(()=>({}));  // [di][musculo] = series
  MUSCULOS.forEach(m=>{
    const occ=[]; split.dias.forEach((d,i)=>{ if(d.musculos.includes(m)) occ.push(i); });
    if(!occ.length||objetivo[m]<=0||!pools[m].length) return;
    repartir(objetivo[m],occ.length).forEach((q,k)=>{ cuota[occ[k]][m]=q; });
  });
  // si un día excede el tiempo disponible, escalar todos los músculos
  // proporcionalmente (nunca eliminar un músculo del día)
  cuota.forEach(cd=>{
    const carga=()=>Object.values(cd).reduce((a,b)=>a+b,0);
    if(carga()<=cap) return;
    // proteger músculos priorizados: escalar primero solo el resto
    const prioL=Object.keys(cd).filter(m=>p.prios.includes(m)).reduce((a,m)=>a+cd[m],0);
    const restoL=carga()-prioL;
    if(restoL>0&&cap-prioL>=restoL*0.5){
      const esc=(cap-prioL)/restoL;
      Object.keys(cd).forEach(m=>{ if(!p.prios.includes(m)) cd[m]=Math.max(2,Math.floor(cd[m]*esc)); });
    }else{
      const esc=cap/carga();
      Object.keys(cd).forEach(m=>{ cd[m]=Math.max(2,Math.floor(cd[m]*esc)); });
    }
    let guard=0;
    while(carga()>cap&&guard++<100){
      let mejor=null;
      Object.keys(cd).forEach(m=>{
        if(cd[m]<=2) return;
        const prio=p.prios.includes(m);
        if(!mejor||(!prio&&mejor.prio)||(prio===mejor.prio&&cd[m]>cd[mejor.m])) mejor={m,prio};
      });
      if(!mejor) break;
      cd[mejor.m]--;
    }
  });
  // elegir ejercicios según las cuotas
  const porDia=split.dias.map(()=>({}));  // [di][musculo] = [{exId,series,reps}]
  MUSCULOS.forEach(m=>{
    split.dias.forEach((d,di)=>{
      const q=cuota[di][m]; if(!q) return;
      partirSeries(q).forEach(ser=>{
        const e=pick(m); if(!e) return;
        (porDia[di][m]=porDia[di][m]||[]).push({id:uid(),exId:e.id,series:ser,reps:e.reps});
      });
    });
  });
  // armar días en el orden del split
  const dias=split.dias.map((d,i)=>({
    dia:'', titulo:d.titulo,
    ejercicios:d.musculos.flatMap(m=>porDia[i][m]||[])
  }));
  // garantizar ejercicios incluidos
  p.incluir.forEach(id=>{
    if(dias.some(d=>d.ejercicios.some(e=>e.exId===id))) return;
    const ex=exPorId(id); if(!ex) return;
    let di=split.dias.findIndex(d=>d.musculos.includes(ex.musculo));
    if(di<0){ di=0; dias.forEach((d,i)=>{ if(d.ejercicios.length<dias[di].ejercicios.length) di=i; }); }
    dias[di].ejercicios.push({id:uid(),exId:id,series:3,reps:ex.reps});
  });
  // asignar días de la semana en orden
  const orden=DIAS_SEM.filter(d=>p.diasSem.includes(d));
  dias.forEach((d,i)=>{ d.dia=orden[i]||'Día '+(i+1); });
  return {
    id:uid(), nombre:p.nombre||split.n, color:COLORES[S.rutinas.length%COLORES.length],
    emoji:EMOJIS[S.rutinas.length%EMOJIS.length], split:split.n, creada:hoy(), dias, sesiones:[]
  };
}

function pintarApp(){
  const app=document.getElementById('app');
  if(vista.p==='inicio') app.innerHTML=vInicio();

  else if(vista.p==='rutina') app.innerHTML=vRutina();
  else if(vista.p==='ejercicios') app.innerHTML=vEjercicios();
  else if(vista.p==='cuerpo') app.innerHTML=vCuerpo();
  else if(vista.p==='sesion') app.innerHTML=vSesion();
  if(vista.p!=='sesion') app.innerHTML+=vTabs();
  app.innerHTML+=timerHtml();   // el cronometro se ve desde cualquier pantalla
  ajustarEspacioCrono();
}
/* La nav bar y el cronómetro son `position:fixed` y tapan el final de la página.
   OJO: reservar el espacio con `padding-bottom` en <body> NO funciona — no extiende
   el alto scrolleable, así que el último contenido queda inalcanzable. Por eso metemos
   un espaciador real dentro del contenido, medido contra el panel (que cambia de alto). */
function ajustarEspacioCrono(){
  const app=document.getElementById('app');
  const tp=document.querySelector('.tpanel');
  const enSesion=vista.p==='sesion';
  const alto=(enSesion?0:80)+(tp?tp.offsetHeight:0)+16;   // nav bar + cronómetro + aire
  const sp=document.createElement('div');
  sp.style.cssText='height:'+alto+'px;flex-shrink:0';
  app.appendChild(sp);
}
/* render() = cambio de pantalla: usa View Transitions para el fundido entre vistas.
   rerender() = actualización en el lugar (tipeo, toggles): siempre directo, porque una
   transición acá pelearía con el foco del input y se sentiría lento. */
const menosMovimiento=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){
  menuAbierto=null;
  const pintar=()=>{ pintarApp(); window.scrollTo(0,0); };
  if(document.startViewTransition&&!menosMovimiento()) document.startViewTransition(pintar);
  else pintar();
}
function rerender(){ const y=window.scrollY; pintarApp(); window.scrollTo(0,y); }
/* Ripple: la respuesta táctil de Material. Se dibuja donde tocaste y se expande. */
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.sl');
  if(!el||menosMovimiento()) return;
  const r=el.getBoundingClientRect();
  const d=Math.max(r.width,r.height)*2;
  const s=document.createElement('span');
  s.className='rip';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s);
  setTimeout(()=>s.remove(),500);
});
/* Navigation bar de M3: el ícono activo va relleno dentro de una píldora indicadora,

/* ---- GRÁFICO ---- */
function vChart(r){
  // ejercicios únicos con nombre
  const vistos={},ops=[];
  r.dias.forEach(d=>d.ejercicios.forEach(e=>{
    if(vistos[e.exId])return; vistos[e.exId]=1;
    const ex=exPorId(e.exId); if(ex) ops.push(ex);
  }));
  if(!ops.length) return '';
  // por defecto: primer ejercicio con historial
  let sel=vista.chartEx;
  if(!sel){
    for(const o of ops){ if((S.logs[o.id]||[]).some(l=>l.p!=null)){ sel=o.id; break; } }
    if(!sel) sel=ops[0].id;
  }
  const pts=(S.logs[sel]||[]).filter(l=>l.p!=null).slice().sort((a,b)=>a.f<b.f?-1:1);
  let svg;
  if(pts.length<2){
    svg=`<div class="empty" style="padding:22px 10px">${pts.length===1?'Un solo registro ('+pts[0].p+' kg el '+fFecha(pts[0].f)+').<br>Cargá peso otro día para ver la curva.':'Sin registros de peso todavía.<br>Anotá el peso en la columna "Peso" y acá vas a ver tu progreso.'}</div>`;
  }else{
    const W=Math.max(320,pts.length*46),H=190,mx=34,my=24;
    const ps=pts.map(x=>x.p);
    let min=Math.min(...ps),max=Math.max(...ps);
    if(min===max){min-=2;max+=2;}
    const X=i=>mx+i*(W-mx-14)/(pts.length-1);
    const Y=v=>H-my-(v-min)*(H-my-18)/(max-min);
    const line=pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.p).toFixed(1)}`).join(' ');
    const dots=pts.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.p).toFixed(1)}" r="4" fill="${r.color}"/>
      <text x="${X(i).toFixed(1)}" y="${(Y(x.p)-9).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--on-surface-var)">${x.p}</text>`).join('');
    const labs=pts.map((x,i)=>(i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0)?`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--on-surface-var)">${fFecha(x.f)}</text>`:'').join('');
    svg=`<div class="chart-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <text x="4" y="${Y(max)+4}" font-size="9" fill="var(--on-surface-var)">${max}</text>
      <text x="4" y="${Y(min)+4}" font-size="9" fill="var(--on-surface-var)">${min}</text>
      <line x1="${mx-6}" y1="${Y(max)}" x2="${W-10}" y2="${Y(max)}" stroke="var(--outline-var)" stroke-dasharray="3 4"/>
      <line x1="${mx-6}" y1="${Y(min)}" x2="${W-10}" y2="${Y(min)}" stroke="var(--outline-var)" stroke-dasharray="3 4"/>
      <polyline points="${line}" fill="none" stroke="${r.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${labs}
    </svg></div>`;
  }
  const dif=pts.length>=2?(pts[pts.length-1].p-pts[0].p):null;
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h3>Progreso</h3>
      ${dif!=null?`<span style="color:${dif>=0?'var(--tertiary)':'var(--error)'};font-weight:700;font-size:.9rem">${dif>=0?'+':''}${Math.round(dif*10)/10} kg</span>`:''}
    </div>
    <div style="height:8px"></div>
    <select style="width:100%" onchange="vista.chartEx=this.value;rerender()">
      ${ops.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.nombre)}</option>`).join('')}
    </select>
    <div style="height:10px"></div>
    ${svg}
    ${(r.sesiones||[]).length?`<p class="hint" style="margin-top:10px">${r.sesiones.length} ${r.sesiones.length===1?'entrenamiento guardado':'entrenamientos guardados'} · ${r.sesiones.filter(x=>x.f.startsWith(hoy().slice(0,7))).length} este mes</p>`:''}
  </div>`;
}

function statsRutina(r){
  const ej=r.dias.reduce((a,d)=>a+d.ejercicios.length,0);
  const ser=r.dias.reduce((a,d)=>a+d.ejercicios.reduce((b,e)=>b+(+e.series||0),0),0);
  const ses=(r.sesiones||[]).length;
  return `<div class="stats">
    <div class="stat"><span class="ic">📅</span><b>${r.dias.length}</b><span>Días</span></div>
    <div class="stat"><span class="ic">🏋️</span><b>${ej}</b><span>Ejercicios</span></div>
    <div class="stat"><span class="ic">🔁</span><b>${ser}</b><span>Series</span></div>
    <div class="stat"><span class="ic">🔥</span><b>${ses}</b><span>Entrenos</span></div>
  </div>`;
}

/* ---- MI PROGRESO FÍSICO (peso, altura, IMC) ---- */
let medForm={peso:'',altura:'',f:''};
function ordenarMedidas(){ S.medidas.sort((a,b)=>a.f<b.f?-1:(a.f>b.f?1:0)); }
function ultMedida(){ return S.medidas.length?S.medidas[S.medidas.length-1]:null; }
function imcDe(p,a){ if(!p||!a) return null; const m=a/100; return Math.round(p/(m*m)*10)/10; }
function catIMC(v){
  if(v==null) return {t:'—',c:'var(--on-surface-var)'};
  if(v<18.5) return {t:'Bajo peso',c:'#4da3ff'};
  if(v<25)   return {t:'Peso normal',c:'var(--tertiary)'};
  if(v<30)   return {t:'Sobrepeso',c:'var(--warn)'};
  return {t:'Obesidad',c:'var(--error)'};
}
function posIMC(v){ return v==null?0:Math.max(0,Math.min(100,(v-15)/25*100)); }
function actualizarIMC(){
  const v=imcDe(+medForm.peso||0,+medForm.altura||0), c=catIMC(v);
  const n=document.getElementById('imc-v'); if(!n) return;
  n.textContent=v!=null?v.toFixed(1):'—';
  const t=document.getElementById('imc-t'); if(t){ t.textContent=c.t; t.style.color=c.c; }
  const m=document.getElementById('imc-m'); if(m) m.style.left=posIMC(v)+'%';
}
function vCuerpo(){
  ordenarMedidas();
  const u=ultMedida();
  if(medForm.peso===''&&u) medForm.peso=String(u.peso);
  if(medForm.altura===''&&u) medForm.altura=String(u.altura);
  if(!medForm.f) medForm.f=hoy();
  const v=imcDe(+medForm.peso||0,+medForm.altura||0), c=catIMC(v);

  const hist=S.medidas.slice().reverse().map((m,i,arr)=>{
    const prev=arr[i+1];
    const d=prev?Math.round((m.peso-prev.peso)*10)/10:null;
    const mi=imcDe(m.peso,m.altura);
    return `<div class="mrow">
      <span class="d">${fFecha(m.f)}</span>
      <span class="c"><b>${m.peso}</b> <small style="color:var(--on-surface-var)">kg</small></span>
      <span class="c" style="color:${catIMC(mi).c};font-weight:700">${mi!=null?mi.toFixed(1):'—'}</span>
      <span class="c ${d==null?'':(d>0?'sube':'baja')}">${d==null?'<span style="color:var(--on-surface-var)">—</span>':(d>0?'+':'')+d+' kg'}</span>
      <button class="menu-btn sl" aria-label="Borrar registro" onclick="borrarMedida('${m.f}')">🗑</button>
    </div>`;
  }).join('');

  const total=S.medidas.length>=2?Math.round((S.medidas[S.medidas.length-1].peso-S.medidas[0].peso)*10)/10:null;

  return `<div class="hdr"><h1>Mi progreso físico</h1></div>
  <div class="wrap">
    <div class="card">
      <label class="lbl">Nuevo registro</label>
      <div class="mgrid">
        <div><span class="u">Peso (kg)</span>
          <input type="number" step="0.1" inputmode="decimal" placeholder="0" value="${esc(medForm.peso)}" oninput="medForm.peso=this.value;actualizarIMC()"></div>
        <div><span class="u">Altura (cm)</span>
          <input type="number" step="1" inputmode="numeric" placeholder="0" value="${esc(medForm.altura)}" oninput="medForm.altura=this.value;actualizarIMC()"></div>
      </div>
      <label class="lbl">Fecha</label>
      <input type="date" style="width:100%" value="${medForm.f}" max="${hoy()}" onchange="medForm.f=this.value||hoy()">
      <div style="height:14px"></div>
      <button class="btn full sl" onclick="guardarMedida()">Guardar registro</button>
      <p class="hint">Cada registro se guarda con su fecha: podés cargar uno nuevo cuando quieras sin perder los anteriores.</p>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h3>Índice de masa corporal</h3>
        <span id="imc-t" style="color:${c.c};font-weight:700;font-size:.85rem">${c.t}</span>
      </div>
      <div style="height:10px"></div>
      <div class="imc"><b id="imc-v">${v!=null?v.toFixed(1):'—'}</b><span style="color:var(--on-surface-var);font-size:.85rem">kg/m²</span></div>
      <div class="bar"><i id="imc-m" style="left:${posIMC(v)}%"></i></div>
      <div class="barl"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div>
      <p class="hint">Es solo un dato de referencia: no distingue músculo de grasa, así que en alguien que entrena suele dar más alto de lo que corresponde.</p>
    </div>

    ${S.medidas.length?`<div class="card">
      <div class="row" style="justify-content:space-between">
        <h3>Evolución del peso</h3>
        ${total!=null?`<span style="color:${total<=0?'var(--tertiary)':'var(--warn)'};font-weight:700;font-size:.9rem">${total>0?'+':''}${total} kg</span>`:''}
      </div>
      <div style="height:10px"></div>
      ${chartMedidas()}
      <div class="mhead"><div>Fecha</div><div>Peso</div><div>IMC</div><div>Cambio</div><div></div></div>
      ${hist}
      <p class="hint">${S.medidas.length} ${S.medidas.length===1?'registro guardado':'registros guardados'} · el respaldo .json también los incluye.</p>
    </div>`:`<div class="empty"><div class="big">⚖️</div>Todavía no cargaste ningún registro.<br>Guardá el primero para empezar a ver tu evolución.</div>`}
  </div>`;
}
function chartMedidas(){
  const pts=S.medidas.slice(-24);
  if(pts.length<2) return `<div class="empty" style="padding:18px 10px">${pts.length===1?'Un solo registro ('+pts[0].peso+' kg el '+fFecha(pts[0].f)+').<br>Cargá otro más adelante para ver la curva.':''}</div>`;
  const W=Math.max(300,pts.length*44),H=175,mx=34,my=24;
  const ps=pts.map(x=>x.peso);
  let min=Math.min(...ps),max=Math.max(...ps);
  if(min===max){ min-=1; max+=1; }
  const X=i=>mx+i*(W-mx-14)/(pts.length-1);
  const Y=v=>H-my-(v-min)*(H-my-18)/(max-min);
  const line=pts.map((x,i)=>`${X(i).toFixed(1)},${Y(x.peso).toFixed(1)}`).join(' ');
  const dots=pts.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.peso).toFixed(1)}" r="4" fill="var(--primary)"/>
    <text x="${X(i).toFixed(1)}" y="${(Y(x.peso)-9).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--on-surface-var)">${x.peso}</text>`).join('');
  const labs=pts.map((x,i)=>(i===0||i===pts.length-1||i%Math.ceil(pts.length/5)===0)?`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--on-surface-var)">${fFecha(x.f)}</text>`:'').join('');
  return `<div class="chart-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <text x="4" y="${Y(max)+4}" font-size="9" fill="var(--on-surface-var)">${max}</text>
    <text x="4" y="${Y(min)+4}" font-size="9" fill="var(--on-surface-var)">${min}</text>
    <line x1="${mx-6}" y1="${Y(max)}" x2="${W-10}" y2="${Y(max)}" stroke="var(--outline-var)" stroke-dasharray="3 4"/>
    <line x1="${mx-6}" y1="${Y(min)}" x2="${W-10}" y2="${Y(min)}" stroke="var(--outline-var)" stroke-dasharray="3 4"/>
    <polyline points="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labs}
  </svg></div>`;
}
function guardarMedida(){
  const peso=Math.round((+medForm.peso)*10)/10, alt=Math.round(+medForm.altura), f=medForm.f||hoy();
  if(!peso||peso<20||peso>400){ toast('Poné un peso válido (kg)'); return; }
  if(!alt||alt<80||alt>250){ toast('Poné una altura válida (cm)'); return; }
  const ya=S.medidas.find(m=>m.f===f);
  if(ya){ ya.peso=peso; ya.altura=alt; } else S.medidas.push({f,peso,altura:alt});
  ordenarMedidas(); guardar();
  medForm={peso:'',altura:'',f:''};
  rerender(); toast(ya?'Registro del '+fFecha(f)+' actualizado ✔':'Registro guardado ✔');
}
function borrarMedida(f){
  confirmar('¿Borrar el registro del '+fFecha(f)+'?','Borrar',()=>{
    S.medidas=S.medidas.filter(m=>m.f!==f); guardar(); rerender(); toast('Registro borrado');
  });
}

/* ---- CONFIRMACIÓN PROPIA (confirm() del navegador se bloquea en algunos visores) ---- */
let confirmCb=null;
function confirmar(msg,accion,cb,color){
  confirmCb=cb;
  const esOk=color==='var(--tertiary)';
  document.getElementById('modal').innerHTML=`<div class="overlay" style="align-items:center" onclick="if(event.target===this)cerrarConfirm()">
    <div class="modal" style="border-radius:var(--r-xl);margin:0 24px;max-width:400px;padding:24px">
      <p style="padding:0 0 24px;line-height:1.5;font-size:.875rem;letter-spacing:.016em;color:var(--on-surface-var)">${msg}</p>
      <div class="row" style="justify-content:flex-end;gap:8px">
        <button class="btn ghost sm sl" onclick="cerrarConfirm()">Cancelar</button>
        <button class="btn sm sl" style="background:${color||'var(--error)'};color:${esOk?'var(--on-tertiary)':'var(--on-error)'}" onclick="okConfirm()">${accion}</button>
      </div>
    </div>
  </div>`;
}
function cerrarConfirm(){ confirmCb=null; document.getElementById('modal').innerHTML=''; }
function okConfirm(){ const cb=confirmCb; cerrarConfirm(); if(cb)cb(); }

/* ---- PICKER (buscador de ejercicios) ---- */
function abrirPicker(modo,di,ei){
  picker={modo,di,ei,q:''};
  renderPicker();
}
function cerrarPicker(){ picker=null; document.getElementById('modal').innerHTML=''; }
function renderPicker(){
  if(!picker) return;
  const titulos={incluir:'Incluir ejercicio',excluir:'Excluir ejercicio',reemplazar:'Reemplazar por…',agregar:'Agregar ejercicio'};
  document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)cerrarPicker()">
    <div class="modal">
      <div class="row" style="justify-content:space-between">
        <h2>${titulos[picker.modo]}</h2>
        <button class="back sl" aria-label="Cerrar" onclick="cerrarPicker()">${icoCerrar}</button>
      </div>
      <div style="height:10px"></div>
      <input id="pk-q" class="spill" placeholder="Buscar ejercicio" oninput="picker.q=this.value;pintarLista()">
      <div class="list" id="pk-list"></div>
    </div>
  </div>`;
  pintarLista();
  document.getElementById('pk-q').focus();
}
function pintarLista(){
  const q=picker.q.toLowerCase().trim();
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const html=MUSCULOS.map(m=>{
    const lista=S.ejercicios.filter(e=>e.musculo===m&&(!q||norm(e.nombre).includes(norm(q))||norm(m).includes(norm(q))));
    if(!lista.length) return '';
    return `<div class="mgrp">${m}</div>`+lista.map(e=>
      `<button class="mitem sl" onclick="elegirEx('${e.id}')">${esc(e.nombre)}<small>${e.reps}</small></button>`).join('');
  }).join('');
  document.getElementById('pk-list').innerHTML=html||'<div class="empty">Sin resultados</div>';
}
function elegirEx(id){
  const m=picker.modo;
  if(m==='incluir'){ if(!formCrear.incluir.includes(id)) formCrear.incluir.push(id); formCrear.excluir=formCrear.excluir.filter(x=>x!==id); cerrarPicker(); rerender(); }
  else if(m==='excluir'){ if(!formCrear.excluir.includes(id)) formCrear.excluir.push(id); formCrear.incluir=formCrear.incluir.filter(x=>x!==id); cerrarPicker(); rerender(); }
  else if(m==='reemplazar'){
    const e=rutina(vista.rid).dias[picker.di].ejercicios[picker.ei];
    const ex=exPorId(id);
    e.exId=id; e.reps=ex.reps;
    guardar(); cerrarPicker(); menuAbierto=null; rerender();
  }
  else if(m==='agregar'){
    const ex=exPorId(id);
    rutina(vista.rid).dias[picker.di].ejercicios.push({id:uid(),exId:id,series:3,reps:ex.reps});
    guardar(); cerrarPicker(); rerender();
  }
}

let timerFin=null, timerInt=null, timerTO=null, timerTotal=0, timerPausa=null, timerAviso=false, avisoTO=null;
let actx=null, swReg=null;
function bannerSesion(){

function setSerie(i,j,c,v){ S.sesionActiva.ej[i].series[j][c]=v===''?null:+v; guardar(); }
function checkSerie(i,j){
  const st=S.sesionActiva.ej[i].series[j];
  st.ok=!st.ok;
  if(st.ok) iniciarTimer(S.descanso||90);
  guardar(); rerender();

function fmtT(sg){ sg=Math.max(0,sg); return Math.floor(sg/60)+':'+String(sg%60).padStart(2,'0'); }
function timerMs(){ return timerPausa!=null?timerPausa:(timerFin!=null?timerFin-Date.now():0); }
function timerActivo(){ return timerFin!=null||timerPausa!=null||timerAviso; }

/* El anillo es un círculo SVG al que le animamos stroke-dashoffset: es el
   "circular progress indicator determinado" de M3. RADIO/CIRC se comparten con tickTimer. */
const T_RADIO=76, T_CIRC=2*Math.PI*T_RADIO;
function anillo(pct,contenido){
  return `<div class="tring">
    <svg viewBox="0 0 180 180">
      <circle class="bg" cx="90" cy="90" r="${T_RADIO}"/>
      <circle class="fg" id="tring-fg" cx="90" cy="90" r="${T_RADIO}"
        stroke-dasharray="${T_CIRC.toFixed(1)}" stroke-dashoffset="${(T_CIRC*(1-pct)).toFixed(1)}"/>
    </svg>
    ${contenido}
  </div>`;
}
function timerHtml(){
  const ct=vista.p!=='sesion'?' contabs':'';
  if(timerAviso){
    return `<div class="tpanel fin${ct}">
      <div class="thead2" style="color:var(--tertiary)"><span>✔ Descanso terminado</span><span></span></div>
      ${anillo(1,'<div class="tnum">0:00</div>')}
      <div class="tsub">¡A darle a la próxima serie! 💪</div>
      <div class="trow2">
        <button class="tbtn sl" onclick="iniciarTimer(timerUlt||S.descanso||90)">↻ Otra vez</button>
        <button class="tbtn pri sl" onclick="cerrarAviso()">Listo</button>
      </div>
    </div>`;
  }
  if(timerFin==null&&timerPausa==null) return '';
  const ms=Math.max(0,timerMs());
  const sg=Math.ceil(ms/1000);
  const pct=timerTotal?Math.max(0,Math.min(1,ms/(timerTotal*1000))):0;
  return `<div class="tpanel${ct}${sg<=10&&timerPausa==null?' warn':''}" id="tpanel">
    <div class="thead2"><span>⏱ Descanso</span><span>de ${fmtT(timerTotal)}</span></div>
    ${anillo(pct,`<div class="tnum" id="resto">${fmtT(sg)}</div>`)}
    <div class="tsub">${timerPausa!=null?'En pausa':'Respirá y preparate para la próxima serie'}</div>
    <div class="trow2">
      <button class="tbtn sl" onclick="ajustarTimer(-15)">−15s</button>
      <button class="tbtn sl" onclick="ajustarTimer(30)">+30s</button>
      <button class="tbtn sl" onclick="togglePausa()">${timerPausa!=null?'▶ Seguir':'❚❚ Pausa'}</button>
      <button class="tbtn pri sl" onclick="pararTimer()">Saltar</button>
    </div>
  </div>`;
}
let timerUlt=0;
function iniciarTimer(seg){
  seg=Math.max(5,Math.round(seg||90)); timerUlt=seg;
  pedirPermisoNotif();
  prepararAudio();
  clearTimeout(avisoTO); timerAviso=false;
  timerTotal=seg; timerPausa=null; timerFin=Date.now()+seg*1000;
  programar(); rerender(); tickTimer();
}
function programar(){
  clearInterval(timerInt); clearTimeout(timerTO);
  if(timerFin==null) return;
  const ms=Math.max(0,timerFin-Date.now());
  timerInt=setInterval(tickTimer,250);
  timerTO=setTimeout(tickTimer,ms+40);
  avisarSW(ms);              // el service worker avisa aunque la app este en segundo plano
}
function pararTimer(){
  clearInterval(timerInt); clearTimeout(timerTO); cancelarSW();
  timerFin=null; timerPausa=null; timerAviso=false; clearTimeout(avisoTO); rerender();
}
function resetTimer(){ pararTimer(); }
function cerrarAviso(){ clearTimeout(avisoTO); timerAviso=false; rerender(); }
function ajustarTimer(seg){
  if(timerPausa!=null){ timerPausa=Math.max(1000,timerPausa+seg*1000); timerTotal=Math.max(timerTotal,Math.ceil(timerPausa/1000)); rerender(); return; }
  if(timerFin==null) return;
  timerFin=Math.max(Date.now()+1000,timerFin+seg*1000);
  timerTotal=Math.max(timerTotal,Math.ceil((timerFin-Date.now())/1000));
  programar(); rerender(); tickTimer();
}
function togglePausa(){
  if(timerPausa!=null){ timerFin=Date.now()+timerPausa; timerPausa=null; programar(); rerender(); tickTimer(); }
  else if(timerFin!=null){
    timerPausa=Math.max(0,timerFin-Date.now()); timerFin=null;
    clearInterval(timerInt); clearTimeout(timerTO); cancelarSW(); rerender();
  }
}
function tickTimer(){
  if(timerFin==null) return;
  const ms=timerFin-Date.now();
  if(ms<=0){ finTimer(); return; }
  const sg=Math.ceil(ms/1000);
  const el=document.getElementById('resto'); if(el) el.textContent=fmtT(sg);
  const fg=document.getElementById('tring-fg');
  if(fg&&timerTotal){
    const pct=Math.max(0,Math.min(1,ms/(timerTotal*1000)));
    fg.setAttribute('stroke-dashoffset',(T_CIRC*(1-pct)).toFixed(1));
  }
  const pa=document.getElementById('tpanel');
  if(pa) pa.classList.toggle('warn',sg<=10);
}
function finTimer(){
  clearInterval(timerInt); clearTimeout(timerTO);
  timerFin=null; timerPausa=null;
  timerAviso=true;
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,450]);
  beep();
  if(document.visibilityState==='visible'){
    if(!('Notification' in window)||Notification.permission!=='granted') flashPantalla();
    toast('¡Descanso terminado, a darle! 💪');
  }else{
    notificar();   // por si el service worker no llego a disparar
  }
  rerender();
  clearTimeout(avisoTO);
  avisoTO=setTimeout(()=>{ timerAviso=false; rerender(); },12000);
}

/* --- notificacion del sistema --- */
function pedirPermisoNotif(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='default'){
    try{ const r=Notification.requestPermission(); if(r&&r.then) r.then(()=>rerender()).catch(()=>{}); }catch(e){}
  }
}
function notificar(){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const opts={body:'Volvé a la barra 💪', tag:'descanso-rutinas', renotify:true,
    vibrate:[200,100,200], icon:'./icon-192.png', badge:'./icon-192.png'};
  if(swReg&&swReg.showNotification){ swReg.showNotification('¡Descanso terminado!',opts).catch(()=>{}); return; }
  try{ new Notification('¡Descanso terminado!',opts); }catch(e){}
}
function avisarSW(ms){
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  if(swReg&&swReg.active) swReg.active.postMessage({tipo:'timer',ms:Math.round(ms)});
}
function cancelarSW(){ if(swReg&&swReg.active) swReg.active.postMessage({tipo:'cancelar'}); }

/* --- sonido corto generado con Web Audio (no hace falta cachear ningun mp3) --- */
function prepararAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=actx||new AC();
    if(actx.state==='suspended') actx.resume().catch(()=>{});
  }catch(e){}
}
function beep(){
  try{
    prepararAudio(); if(!actx) return;
    const t0=actx.currentTime;
    [[0,880],[.22,880],[.44,1245]].forEach(([off,hz])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=hz;
      g.gain.setValueAtTime(.0001,t0+off);
      g.gain.exponentialRampToValueAtTime(.45,t0+off+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t0+off+.19);
      o.connect(g); g.connect(actx.destination);
      o.start(t0+off); o.stop(t0+off+.21);
    });
  }catch(e){}
}
/* aviso visual fuerte para cuando el permiso de notificaciones fue denegado */
function flashPantalla(){
  const d=document.createElement('div'); d.className='flash';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1400);
}
function avisoNotif(){
  if(!('Notification' in window)) return '<p class="hint">Este navegador no puede mandar notificaciones: al llegar a 0 la app avisa con sonido, vibración y un aviso en pantalla.</p>';
  if(Notification.permission==='granted') return '<p class="hint">🔔 Al llegar a 0 vas a recibir una notificación aunque tengas la app en segundo plano.</p>';
  if(Notification.permission==='denied') return '<p class="hint">🔕 Bloqueaste las notificaciones. El aviso va a ser con sonido, vibración y un flash en pantalla (necesitás tener la app abierta). Podés habilitarlas desde los ajustes del sitio en Chrome.</p>';
  return `<p class="hint">🔔 Activá las notificaciones para que te avise aunque salgas de la app. <button style="color:var(--primary);font-weight:700;text-decoration:underline" onclick="pedirPermisoNotif()">Activar</button></p>`;
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||timerFin==null) return;
  if(Date.now()>=timerFin) finTimer(); else { programar(); tickTimer(); }
});
function salirSesion(){
  const rid=S.sesionActiva.rid;
  vista={p:'rutina',rid,cfg:false,chartEx:null}; render();
}
function terminarSesion(){
  const n=S.sesionActiva.ej.reduce((a,se)=>a+se.series.filter(x=>x.ok).length,0);
  if(!n){ confirmar('No marcaste ninguna serie. ¿Descartar el entrenamiento?','Descartar',descartarSesion); return; }
  confirmar('¿Terminar y guardar el entrenamiento?','Guardar',finalizarSesion,'var(--tertiary)');
}
function finalizarSesion(){
  const s=S.sesionActiva, r=rutina(s.rid), d=r.dias[s.di];
  const dur=Math.max(1,Math.round((Date.now()-s.inicio)/60000));
  const reg={f:hoy(), dia:d.dia, titulo:d.titulo, dur, ej:[]};
  const prs=[];
  s.ej.forEach(se=>{
    const hechas=se.series.filter(x=>x.ok);
    if(!hechas.length) return;
    reg.ej.push({exId:se.exId, series:hechas.map(x=>({p:x.p,r:x.r}))});
    const best=hechas.reduce((a,x)=>(x.p!=null&&(a==null||x.p>a.p))?x:a,null);
    if(best){
      const prev=prDe(se.exId);
      const l=S.logs[se.exId]=S.logs[se.exId]||[];
      const u=l.length?l[l.length-1]:null;
      if(u&&u.f===reg.f){ u.p=best.p; u.r=best.r; } else l.push({f:reg.f,p:best.p,r:best.r});
      if(prev!=null&&best.p>prev){ const ex=exPorId(se.exId); prs.push((ex?ex.nombre:'?')+' → '+best.p+' kg'); }
    }
  });
  (r.sesiones=r.sesiones||[]).push(reg);
  S.sesionActiva=null; resetTimer();
  guardar(); vista={p:'rutina',rid:r.id,cfg:false,chartEx:null}; render();
  toast(prs.length?'🏆 ¡Récord! '+prs.join(' · '):'Entrenamiento guardado · '+dur+' min 💪');
}
function descartarSesion(){
  const rid=S.sesionActiva?S.sesionActiva.rid:null;
  S.sesionActiva=null; resetTimer();
  guardar(); vista=rid?{p:'rutina',rid,cfg:false,chartEx:null}:{p:'inicio'}; render();
  toast('Entrenamiento descartado');
}

/* ---- CALENDARIO DE ACTIVIDAD ---- */
function vCalendario(){
  const fechas=new Set();
  S.rutinas.forEach(r=>{ fechasEntrenadas(r).forEach(f=>fechas.add(f)); });
  if(!fechas.size) return '';
  const hoyD=new Date(); const dow=(hoyD.getDay()+6)%7;
  const finSem=new Date(hoyD); finSem.setDate(hoyD.getDate()+(6-dow));
  const cols=[];
  for(let w=14;w>=0;w--){
    const col=[];
    for(let dd=0;dd<7;dd++){
      const dt=new Date(finSem); dt.setDate(finSem.getDate()-w*7-(6-dd));
      const iso=isoDe(dt);
      const futuro=dt>hoyD;
      col.push(`<i class="${fechas.has(iso)?'on':''}"${futuro?' style="opacity:.25"':''}></i>`);
    }
    cols.push('<div class="col">'+col.join('')+'</div>');
  }
  const racha=rachaSemanas(fechas);
  const mesA=hoy().slice(0,7); let esteMes=0; fechas.forEach(f=>{ if(f.startsWith(mesA)) esteMes++; });
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h3>Actividad</h3>
      ${racha>0?`<span style="color:var(--primary);font-weight:700;font-size:.9rem">🔥 ${racha} ${racha===1?'semana':'semanas seguidas'}</span>`:''}
    </div>
    <div style="height:10px"></div>
    <div class="cal">${cols.join('')}</div>
    <p class="hint">${esteMes} ${esteMes===1?'día entrenado':'días entrenados'} este mes · últimas 15 semanas</p>
  </div>`;
}

/* ---- COMPARTIR RUTINA ---- */
function compartirRutina(id){
  const r=rutina(id);
  let t='🏋️ '+r.nombre+' ('+r.split+', '+r.dias.length+' días)\n';
  r.dias.forEach(d=>{
    t+='\n📅 '+d.dia.toUpperCase()+' — '+d.titulo+'\n';
    d.ejercicios.forEach(e=>{
      const ex=exPorId(e.exId);
      t+='• '+(ex?ex.nombre:'?')+' — '+e.series+'×'+e.reps+'\n';
    });

  if(navigator.share){ navigator.share({text:t}).catch(()=>{}); }
  else{

/* ---- COPIAR / PEGAR RUTINAS ----
   El portapapeles interno vive en una variable de la app (y se espeja en su propia
   clave de localStorage para que sobreviva a un reinicio). No depende de permisos.
   Ademas se intenta copiar el JSON al portapapeles del sistema para poder pasar
   una rutina a otro telefono, pero eso es un extra: si falla, no molesta. */
const CLIP_KEY='rutinasGym_clip';
let portapapeles=null, pegarCtx={pesos:true};

function cargarClip(){
  try{ portapapeles=JSON.parse(localStorage.getItem(CLIP_KEY))||null; }catch(e){ portapapeles=null; }
  if(portapapeles&&(portapapeles.app!=='misrutinas'||!Array.isArray(portapapeles.dias))) portapapeles=null;
}
function setClip(o){
  portapapeles=o;
  try{ localStorage.setItem(CLIP_KEY,JSON.stringify(o)); }catch(e){}
}
function normNom(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }

/* Serializa la rutina completa. Los ejercicios viajan por NOMBRE (no por id)
   asi el JSON tambien sirve en otro dispositivo. */
function serializarRutina(r){
  return {
    app:'misrutinas', tipo:'rutina', v:1, copiada:hoy(),
    nombre:r.nombre, split:r.split, color:r.color, emoji:r.emoji,
    dias:r.dias.map(d=>({
      dia:d.dia, titulo:d.titulo,
      ejercicios:d.ejercicios.map(e=>{
        const ex=exPorId(e.exId)||{nombre:'Ejercicio',musculo:'Pecho',tier:3};
        return {nombre:ex.nombre, musculo:ex.musculo, tier:ex.tier,
                series:e.series, reps:e.reps, nota:e.nota||'',
                log:(S.logs[e.exId]||[]).map(l=>({f:l.f,p:l.p,r:l.r}))};
      })
    }))
  };
}
/* Busca el ejercicio por nombre; si no existe (rutina de otro telefono) lo crea. */
function resolverEx(o){
  const ex=S.ejercicios.find(e=>normNom(e.nombre)===normNom(o.nombre));
  if(ex) return ex.id;
  const nuevo={id:uid(), nombre:o.nombre||'Ejercicio', musculo:MUSCULOS.includes(o.musculo)?o.musculo:'Pecho',
               tier:o.tier||3, reps:o.reps||'10-12', custom:true};
  S.ejercicios.push(nuevo); return nuevo.id;
}
function materializarDias(pl,conPesos){
  return pl.dias.map(d=>({
    dia:d.dia||'', titulo:d.titulo||'',
    ejercicios:(d.ejercicios||[]).map(e=>{
      const exId=resolverEx(e);
      if(conPesos&&(e.log||[]).length) mezclarLog(exId,e.log);
      return {id:uid(), exId, series:+e.series||3, reps:e.reps||'10-12', nota:e.nota||''};
    })
  }));
}
function copiarRutina(id){
  const r=rutina(id); if(!r) return;
  const pl=serializarRutina(r);
  setClip(pl);
  const n=pl.dias.reduce((a,d)=>a+d.ejercicios.length,0);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(JSON.stringify(pl))
      .then(()=>toast('Copiada ('+n+' ejercicios) — también al portapapeles del celu'))
      .catch(()=>toast('Rutina copiada ('+n+' ejercicios)'));
  }else toast('Rutina copiada ('+n+' ejercicios)');
  rerender();
}
function nombreLibre(n){
  const base=String(n||'Rutina').replace(/ \(copia( \d+)?\)$/,'');
  let x=base,i=2;
  while(S.rutinas.some(r=>r.nombre===x)){ x=base+' (copia'+(i>2?' '+(i-1):'')+')'; i++; }
  return x;
}
function abrirPegar(){ pegarCtx={pesos:true}; renderPegar(); }
function cerrarModal(){ document.getElementById('modal').innerHTML=''; }
function renderPegar(){
  const pl=portapapeles;
  const cuerpo=pl?(()=>{
    const nEj=pl.dias.reduce((a,d)=>a+d.ejercicios.length,0);
    const nSer=pl.dias.reduce((a,d)=>a+d.ejercicios.reduce((b,e)=>b+(+e.series||0),0),0);
    const conLog=pl.dias.some(d=>d.ejercicios.some(e=>(e.log||[]).length));
    return `<div class="card" style="margin-bottom:14px">
        <small style="color:var(--on-surface-var)">En el portapapeles</small>
        <h3 style="margin-top:2px">${pl.emoji||''} ${esc(pl.nombre||'Rutina')}</h3>
        <p class="hint">${pl.dias.length} días · ${nEj} ejercicios · ${nSer} series${pl.copiada?' · copiada '+fFecha(pl.copiada):''}</p>
      </div>
      ${conLog?`<div class="chips" style="margin-bottom:14px">
        <button class="chip sl ${pegarCtx.pesos?'on':''}" onclick="pegarCtx.pesos=true;renderPegar()">Con los pesos</button>
        <button class="chip sl ${pegarCtx.pesos?'':'on'}" onclick="pegarCtx.pesos=false;renderPegar()">Sin pesos (de cero)</button>
      </div>`:''}
      <button class="opt sl" onclick="pegarComoNueva()">＋ Pegar como rutina nueva<small>Se agrega a la lista sin tocar las que ya tenés</small></button>
      ${S.rutinas.length?`<div class="secc">O sobrescribir una existente</div>`+
        S.rutinas.map(r=>`<button class="opt sl" onclick="pegarSobre('${r.id}')">${r.emoji} ${esc(r.nombre)}<small>Reemplaza sus días y ejercicios · mantiene el nombre y el historial de entrenamientos</small></button>`).join(''):''}`;
  })():`<div class="empty" style="padding:26px 10px">No hay ninguna rutina copiada.<br>Tocá el botón de copiar (⧉) de una rutina para copiarla.</div>`;
  document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)cerrarModal()">
    <div class="modal">
      <div class="row" style="justify-content:space-between">
        <h2>Pegar rutina</h2><button class="back sl" aria-label="Cerrar" onclick="cerrarModal()">${icoCerrar}</button>
      </div>
      <div class="list" style="margin-top:14px">
        ${cuerpo}
        <div class="secc">Desde otro dispositivo</div>
        <button class="opt sl" onclick="leerDelSistema()">📥 Leer del portapapeles del celular<small>Pegá acá el texto que copiaste con "Copiar rutina" en otro teléfono</small></button>
      </div>
    </div>
  </div>`;
}
function pegarComoNueva(){
  const pl=portapapeles; if(!pl) return;
  const r={id:uid(), nombre:nombreLibre(pl.nombre), color:pl.color||COLORES[S.rutinas.length%COLORES.length],
    emoji:pl.emoji||EMOJIS[S.rutinas.length%EMOJIS.length], split:pl.split||'Personalizada',
    creada:hoy(), dias:materializarDias(pl,pegarCtx.pesos), sesiones:[]};
  S.rutinas.push(r); guardar(); cerrarModal();
  vista={p:'rutina',rid:r.id,cfg:false,chartEx:null}; render();
  toast('Pegada como "'+r.nombre+'" ✔');
}
function pegarSobre(rid){
  const pl=portapapeles, r=rutina(rid); if(!pl||!r) return;
  cerrarModal();
  confirmar('Se reemplazan los días y ejercicios de <b>'+esc(r.nombre)+'</b> por los de <b>'+esc(pl.nombre)+'</b>.<br><br>El nombre, el color y el historial de entrenamientos de la rutina se mantienen. ¿Seguir?','Sobrescribir',()=>{
    r.dias=materializarDias(pl,pegarCtx.pesos);
    r.split=pl.split||r.split;
    guardar(); vista={p:'rutina',rid:r.id,cfg:false,chartEx:null}; render();
    toast('Rutina sobrescrita ✔');
  });
}
function usarTexto(txt){
  let o=null;
  try{ o=JSON.parse(String(txt).trim()); }catch(e){}
  if(o&&o.app==='misrutinas'&&Array.isArray(o.dias)){ setClip(o); renderPegar(); toast('Rutina leída ✔'); return true; }
  toast('Ese texto no es una rutina válida'); return false;
}
function leerDelSistema(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(t=>{ if(!usarTexto(t)) pedirTexto(); }).catch(()=>pedirTexto());
  }else pedirTexto();
}
function pedirTexto(){
  document.getElementById('modal').innerHTML=`<div class="overlay" style="align-items:center" onclick="if(event.target===this)cerrarModal()">
    <div class="modal" style="border-radius:18px;margin:0 20px;max-width:440px">
      <h2>Pegar el texto de la rutina</h2>
      <p class="hint">Mantené apretado el recuadro y elegí "Pegar".</p>
      <div style="height:10px"></div>
      <textarea id="clip-txt" rows="5" style="width:100%;resize:vertical;font-size:.8rem" placeholder='{"app":"misrutinas",...}'></textarea>
      <div style="height:14px"></div>
      <div class="row">
        <button class="btn ghost sm sl" style="flex:1" onclick="renderPegar()">Volver</button>
        <button class="btn sm sl" style="flex:1" onclick="usarTexto(document.getElementById('clip-txt').value)">Usar</button>
      </div>
    </div>
  </div>`;
  const t=document.getElementById('clip-txt'); if(t) t.focus();
}

/* ---- EXPORT / IMPORT ---- */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='rutinas-respaldo-'+hoy()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  S.ultimoRespaldo=hoy(); guardar();
  toast('Respaldo descargado'); rerender();
}
function importar(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.ejercicios||!d.rutinas) throw 0;
      confirmar('Esto reemplaza tus datos actuales por el respaldo. ¿Continuar?','Continuar',()=>{
        S=d; normalizar(); guardar(); render(); toast('Respaldo importado ✔');
      });
    }catch(e){ toast('Archivo inválido'); }
  };
  rd.readAsText(f);
}

/* ---- UTIL ---- */
let toastT=null;
function toast(msg){
  clearTimeout(toastT);
  let t=document.getElementById('toast');
  if(t) t.remove();
  t=document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  document.body.classList.add('snack');   // hace lugar: el FAB sube mientras dura el aviso
  toastT=setTimeout(()=>{ t.remove(); document.body.classList.remove('snack'); },2600);
}
document.addEventListener('click',e=>{
  if(menuAbierto!=null&&!e.target.closest('.menu')&&!e.target.closest('.menu-btn')){ menuAbierto=null; rerender(); }
});

cargar();
cargarClip();
render();

/* pedirle al navegador que no borre los datos por inactividad */
if(navigator.storage&&navigator.storage.persist){
  navigator.storage.persisted().then(ya=>{ if(!ya) navigator.storage.persist(); });
}

/* PWA: solo se registra cuando la app corre desde una URL https (GitHub Pages) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('./sw.js').then(r=>{ swReg=r; }).catch(()=>{});
  navigator.serviceWorker.ready.then(r=>{ swReg=r; }).catch(()=>{});
}
</script>
